name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck k8s-deploy/scripts/*.sh tests/*.sh
      - name: Run tests
        run: tests/run.sh
        env:
          PREPULL_TEST_MANIFEST_OUTPUT: /tmp/prepull-manifest.json
      - name: Validate generated Kubernetes resources
        run: >-
          docker run --rm -i
          ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary -kubernetes-version 1.33.0
          < /tmp/prepull-manifest.json
      - name: Check workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
